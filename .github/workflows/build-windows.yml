name: Build Windows installer

# Gera o EdgeFutAI-Setup.exe num runner Windows (o sidecar PyInstaller não pode ser
# cross-compilado). O instalador fica disponível como artifact do run e, em push /
# execução manual, também como asset de uma pré-release "dev-latest".

on:
  push:
    branches: [main, "cursor/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TRIPLE: x86_64-pc-windows-msvc
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Engine — dependências
        working-directory: engine
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Engine — testes
        working-directory: engine
        run: python -m pytest -q

      - name: Engine — PyInstaller (sidecar)
        working-directory: engine
        run: python -m PyInstaller edgefut-engine.spec --noconfirm --clean --distpath dist --workpath build

      - name: Engine — copiar sidecar e validar /health
        run: |
          $bin = "apps/desktop/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item "engine/dist/edgefut-engine.exe" "$bin/edgefut-engine-$env:TRIPLE.exe" -Force
          $exe = Resolve-Path "$bin/edgefut-engine-$env:TRIPLE.exe"
          $p = Start-Process -PassThru -NoNewWindow $exe -ArgumentList "--port","8799","--no-bootstrap","--no-scheduler"
          try {
            $ok = $false
            for ($i = 0; $i -lt 120 -and -not $ok; $i++) {
              Start-Sleep -Milliseconds 500
              try { $ok = (Invoke-RestMethod "http://127.0.0.1:8799/health" -TimeoutSec 2).status -eq "ok" } catch {}
            }
            if (-not $ok) { throw "sidecar não respondeu em /health" }
            Write-Host "sidecar OK ($([math]::Round((Get-Item $exe).Length / 1MB)) MB)"
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Frontend — dependências
        run: pnpm install --frozen-lockfile

      - name: Frontend — testes e typecheck
        run: pnpm -r test && pnpm -r typecheck

      - name: Tauri — bundle NSIS
        run: pnpm --filter @edgefut/desktop tauri build --bundles nsis

      - name: Coletar instalador
        run: |
          $setup = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $setup.FullName "dist/EdgeFutAI-Setup.exe" -Force
          Get-FileHash "dist/EdgeFutAI-Setup.exe" -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: EdgeFutAI-Setup
          path: dist/EdgeFutAI-Setup.exe
          if-no-files-found: error

      - name: Pré-release dev-latest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'EdgeFut AI — build de desenvolvimento' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            Build automático de `${{ github.ref_name }}` @ `${{ github.sha }}`.
            Instalador Windows (NSIS, por usuário): **EdgeFutAI-Setup.exe**.
            O app roda 100% local (engine em 127.0.0.1:8765), não faz login nem apostas.
          files: dist/EdgeFutAI-Setup.exe
          fail_on_unmatched_files: true
