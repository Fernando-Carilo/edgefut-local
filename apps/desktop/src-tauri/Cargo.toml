[package]
name = "edgefut-desktop"
version = "0.1.0"
description = "EdgeFut AI — assistente local de análise quantitativa de futebol"
authors = ["Fernando"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "edgefut_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
